# ============================================================
# wpi config — Self-hosted Firecrawl integration
# ============================================================
# Drop this into your project as .pi/wpi.yml (or merge into
# your existing wpi.yml) to point the web extension at a
# self-hosted Firecrawl instance.
#
# Prerequisites:
#   1. Start Firecrawl:  cd example/firecrawl && docker compose up -d
#   2. Verify:           curl http://localhost:3002/v2/scrape ...
#
# No FIRECRAWL_API_KEY needed — self-hosted instances don't
# require authentication by default.
# ============================================================

docker:
  env:
    # Point the web extension at your local Firecrawl instance
    FIRECRAWL_BASE_URL: http://localhost:3002

    # No API key required for self-hosted (leave empty)
    # FIRECRAWL_API_KEY: ""

    # Optional: restrict which domains the agent can fetch
    FIRECRAWL_ALLOWED_DOMAINS: github.com,docs.firecrawl.dev

    # Optional: cache TTL in seconds (default 300 = 5 min)
    FIRECRAWL_CACHE_TTL: 600
